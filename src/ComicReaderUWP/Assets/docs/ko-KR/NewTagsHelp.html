<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>새 태그를 입력</title>
<style>
body { margin: 24px auto; max-width: 900px; padding: 0 24px; font-family: "Segoe UI", sans-serif; line-height: 1.5; color: #1a1a1a; background: #ffffff; }
h1 { font-size: 1.6em; }
h2 { margin-top: 1.8em; padding-bottom: 4px; font-size: 1.2em; border-bottom: 1px solid #d0d0d0; }
table { width: 100%; margin: 8px 0; border-collapse: collapse; }
td { padding: 4px 8px; vertical-align: top; border-bottom: 1px solid #eeeeee; }
td.term { width: 1%; white-space: nowrap; font-family: Consolas, monospace; }
td.desc { white-space: normal; }
p { margin: 8px 0; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>새 태그를 입력</h1>
<table>
<tr><td class="term">카테고리: 태그1, 태그2</td><td class="desc">‘카테고리’에 ‘태그1’과 ‘태그2’를 추가합니다.</td></tr>
<tr><td class="term">카테고리:: 태그1, 태그2</td><td class="desc">‘카테고리’를 ‘태그1’과 ‘태그2’로 덮어씁니다.</td></tr>
</table>
</body>
</html>
